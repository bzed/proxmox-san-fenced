name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Generate test results
        run: cargo nextest run --all-features --workspace --profile ci

      - name: Inject file paths into JUnit XML for Codecov
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          tree = ET.parse('target/nextest/ci/junit.xml')
          root = tree.getroot()

          for testcase in root.iter('testcase'):
              classname = testcase.get('classname')
              if classname:
                  parts = classname.split('::')
                  pkg = parts[0]
                  test_file = parts[1] if len(parts) > 1 else 'lib'
                  
                  # Handle binary tests
                  if test_file.startswith('bin/'):
                      if test_file.split('/')[1] == pkg:
                          test_file = 'main'
                      else:
                          test_file = test_file.replace('bin/', 'bin/')
                          
                  # Try different prefixes
                  prefixes = [
                      '',
                      f'{pkg}/',
                      f'tools/{pkg}/',
                      f'libpve-san/',
                  ]
                  
                  for pfx in prefixes:
                      possible_paths = [
                          f'{pfx}tests/{test_file}.rs',
                          f'{pfx}src/{test_file}.rs',
                          f'{pfx}src/{test_file}/mod.rs',
                      ]
                      for p in possible_paths:
                          if os.path.exists(p):
                              testcase.set('file', p)
                              break
                      if testcase.get('file'):
                          break

          tree.write('target/nextest/ci/junit.xml')
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results
