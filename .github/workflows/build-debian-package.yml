name: Build Debian Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y debhelper fakeroot dpkg-dev rustup ca-certificates git build-essential

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc
          mkdir -p debian-build
          cp ../pve-san-fenced_* debian-build/ 2>/dev/null || true
          cp ../pve-san-fenced-dbgsym_* debian-build/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-artifacts
          path: debian-build/
